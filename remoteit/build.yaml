# Home Assistant's public base images (Alpine), pinned: Supervisor builds the add-on on the machine from the one for
# its arch. The remote.it device is fetched by the Dockerfile (DEVICE_VERSION).
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.24-2026.10.0
  amd64: ghcr.io/home-assistant/amd64-base:3.24-2026.10.0
labels:
  org.opencontainers.image.title: remote.it Home Assistant add-on
  org.opencontainers.image.source: https://github.com/remoteit/home-assistant-addons
