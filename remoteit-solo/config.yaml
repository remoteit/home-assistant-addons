# Generated by bin/gen from src/ and stages/solo/: edit those, not this folder.
name: "remote.it (solo test build)"
version: "0.13.1"
slug: remoteit_solo
description: "Test build for remote.it's solo stage, unsupported: reach Home Assistant and your home network from anywhere"
url: https://github.com/remoteit/home-assistant-addons/tree/main/remoteit-solo
# Home Assistant's stage: stable, or experimental for a test build — shown in the store only with Advanced mode on.
stage: experimental
arch:
  - aarch64
  - amd64
startup: services
# No Docker init: the device image's entrypoint is PID 1, as it is in the image itself. Its self-update (auto_update)
# is taken only while it is — it starts and stops the daemons a release brings — and it reaps what it starts.
init: false
# The host's network: Home Assistant's own UI on 127.0.0.1, and the machines on the home network by their addresses.
host_network: true
# The tun device and NET_ADMIN alone — not full_access — for an exit, the subnet and an exit node: the device's
# interfaces and an exit's routes (on the host's network, so the machine's). NET_ADMIN lowers Home Assistant's
# security rating by one (6 to 5); the device costs nothing. Without the device the entrypoint turns subnet_control
# and exit_node_control off.
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
ingress: true
ingress_port: 29190
panel_icon: mdi:remote-desktop
panel_title: remote.it
# Supervisor's /core/info: the port Home Assistant serves its UI on, and whether it serves TLS. And, with the
# console_admin option, `ha` in the console: the homeassistant role reaches Home Assistant's core (restart, logs,
# check the configuration), not other add-ons or the host.
hassio_api: true
hassio_role: homeassistant
# Home Assistant's configuration, writable, at /config: for the console with console_admin (custom integrations,
# configuration files). The console's root terminal reaches it whether or not console_admin is on.
map:
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  registration_code: ""
  device_name: Home Assistant
  stage: solo
  any_port: false
  console: true
  console_admin: false
  auto_update: true
schema:
  registration_code: password?
  device_name: str?
  stage: list(solo)
  any_port: bool
  console: bool
  console_admin: bool
  auto_update: bool
