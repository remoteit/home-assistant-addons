configuration:
  registration_code:
    name: Registration code
    description: >-
      A registration code from the remote.it portal (Add device), used once, on the first start. Or leave it empty and
      enter it in the remote.it panel.
  device_name:
    name: Device name
    description: The name the device registers with, unless the code names it.
  stage:
    name: Stage
    description: The remote.it environment this device registers with.
  any_port:
    name: Any port
    description: >-
      Let the portal open connections to any port on any host this machine reaches, not only the services you add.
      Off by default.
  console:
    name: Console
    description: >-
      Let the people who manage this device open a terminal on it from the portal, and an AI run commands on it: a shell
      in this add-on's container, on the host's network — the terminal as root, an AI's commands as your own account.
      On by default.
  console_admin:
    name: Console manages Home Assistant
    description: >-
      Let the console's own accounts (an AI's commands) manage Home Assistant: sudo in the add-on's container, its
      configuration at /config, and the `ha` command (restart Home Assistant, read its logs, check its configuration).
      Off by default.
  auto_update:
    name: Update the device automatically
    description: >-
      Let the device take remote.it's releases itself, as soon as they are out, instead of waiting for an add-on update:
      each new version starts beside the running one and takes over only once it is working, or the running one stays.
      An add-on update newer than what the device took always wins. On by default.
