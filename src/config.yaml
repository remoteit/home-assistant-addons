# Generated by bin/gen from src/ and stages/@@STAGE@@/: edit those, not this folder.
name: "@@ADDON_NAME@@"
version: "@@ADDON_VERSION@@"
slug: @@ADDON_SLUG@@
description: "@@ADDON_DESCRIPTION@@"
url: https://github.com/remoteit/home-assistant-addons/tree/main/@@ADDON_DIR@@
# Home Assistant's stage: stable, or experimental for a test build — shown in the store only with Advanced mode on.
stage: @@HA_STAGE@@
arch:
  - aarch64
  - amd64
startup: services
# The host's network: Home Assistant's own UI on 127.0.0.1, and the machines on the home network by their addresses.
host_network: true
ingress: true
ingress_port: 29190
panel_icon: mdi:remote-desktop
panel_title: remote.it
# Supervisor's /core/info: the port Home Assistant serves its UI on, and whether it serves TLS.
hassio_api: true
options:
  registration_code: ""
  device_name: Home Assistant
  stage: @@STAGE@@
  any_port: false
schema:
  registration_code: password?
  device_name: str?
  stage: list(@@STAGE@@)
  any_port: bool
